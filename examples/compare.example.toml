# 仅示意原脚本的素材布局与手工配置方式；不是通用自动选片参数。
# 视频和字体的相对路径以此 TOML 所在目录为基准，替换成自有或授权文件。
font = "../fonts/chinese.ttc"

[am]
path = "../videos/amateur.mp4"
hit = 10.0
roi = [450, 150, 1500, 1080]
label = "业余爱好者"
sub = "后场动作 · 背后机位"

[pro]
path = "../videos/reference_slow.mp4"
# 源视频已慢放：窗口起点、触球时刻、窗口终点。
win = [3.0, 18.85, 25.0]
src_fps = 8
vf = "crop=900:1080:800:0,scale=750:900"
roi = [0, 0, 750, 900]
label = "授权示范者"
sub = "后场动作 · 正面机位；与背后机位方向不同"

[full]
path = "../videos/reference_fullbody.mp4"
roi = [0, 60, 360, 420]
label = "授权示范者 · 全身动作"
sub = "全身片段 · 背后机位"

[credits]
lines = [
  "素材请使用自有或取得授权的视频，并填写实际来源说明",
  "业余：自有训练素材",
  "高手：授权动作示范素材",
  "全身片段：授权动作示范素材",
  "",
  "下一步：自动挑出关键动作 → 大屏往复对比",
]
